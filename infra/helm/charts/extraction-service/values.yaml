replicaCount: 2

image:
  repository: distill/extraction-service
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations: {}
  name: "extraction-service"

service:
  type: ClusterIP
  port: 3003

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: 3003
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 3003
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  PORT: "3003"
  SERVICE_NAME: "extraction-service"
  LOG_LEVEL: "INFO"
  AI_PROVIDER_ORDER: "gemini,openai,anthropic"
  AI_PROVIDER_GEMINI_ENABLED: "true"
  AI_PROVIDER_OPENAI_ENABLED: "true"
  AI_PROVIDER_ANTHROPIC_ENABLED: "true"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "120"

secretEnv:
  - DATABASE_URL
  - RABBITMQ_URL
  - S3_ENDPOINT
  - S3_ACCESS_KEY
  - S3_SECRET_KEY
  - S3_BUCKET
  - GEMINI_API_KEY
  - OPENAI_API_KEY
  - ANTHROPIC_API_KEY

secrets:
  DATABASE_URL: ""
  RABBITMQ_URL: ""
  S3_ENDPOINT: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
  S3_BUCKET: ""
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

volumes:
  - name: tmp-processing
    emptyDir:
      sizeLimit: 500Mi

volumeMounts:
  - name: tmp-processing
    mountPath: /tmp

migration:
  enabled: false
  command: ["alembic", "upgrade", "head"]
