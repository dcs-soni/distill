replicaCount: 2

image:
  repository: distill/review-service
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations: {}
  name: "review-service"

service:
  type: ClusterIP
  port: 3005

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

livenessProbe:
  httpGet:
    path: /health
    port: 3005
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 3005
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

env:
  PORT: "3005"
  NODE_ENV: "production"
  SERVICE_NAME: "review-service"
  DOCUMENT_SERVICE_URL: "http://document-service:3002"
  EXTRACTION_SERVICE_URL: "http://extraction-service:3003"

secretEnv:
  - DATABASE_URL
  - RABBITMQ_URL

secrets:
  DATABASE_URL: ""
  RABBITMQ_URL: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

volumes: []
volumeMounts: []
