[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-extraction-service"
version = "1.0.0"
description = "Financial data extraction using multi-agent AI pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "google-genai",
    "openai",
    "anthropic",
    "pdfplumber",
    "pymupdf",
    "pydantic",
    "structlog",
    "aio-pika",
    "prometheus-fastapi-instrumentator"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/infrastructure/ai/*_provider.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
